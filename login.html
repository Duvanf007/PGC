<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Seguridad Guachetá</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="shield-big">🛡️</div>
      <h2>Bienvenido de vuelta</h2>
      <p>Ingresa al Sistema de Seguridad de Guachetá</p>
    </div>

    <div id="msg-error" class="error-msg"></div>
    <div id="msg-success" class="success-msg"></div>

    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" required placeholder="correo@ejemplo.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div style="position:relative">
          <input type="password" id="password" class="form-control" required placeholder="Tu contraseña" autocomplete="current-password" style="padding-right:44px">
          <button type="button" onclick="togglePass()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1em" id="pass-eye">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="btn-login" style="margin-top:8px">Iniciar Sesión</button>
    </form>

    <div class="divider"></div>

    <div style="background:#f8faff;border-radius:10px;padding:16px;font-size:0.82em;color:#5f6368;margin-bottom:16px">
      <strong style="display:block;margin-bottom:10px;color:#374151;text-align:center">🏛️ Acceso Institucional Rápido</strong>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button type="button" class="btn btn-outline" style="font-size:0.85em;padding:8px" onclick="quickLogin('admin@guacheta.gov.co', 'admin123')">🔑 Admin</button>
        <button type="button" class="btn btn-outline" style="font-size:0.85em;padding:8px" onclick="quickLogin('alcaldia@guacheta.gov.co', 'alcaldia123')">🏛️ Alcaldía</button>
        <button type="button" class="btn btn-outline" style="font-size:0.85em;padding:8px" onclick="quickLogin('policia@guacheta.gov.co', 'policia123')">👮 Policía</button>
        <button type="button" class="btn btn-outline" style="font-size:0.85em;padding:8px" onclick="quickLogin('hospital@guacheta.gov.co', 'hospital123')">🏥 Hospital</button>
      </div>
    </div>

    <div class="auth-links">
      ¿No tienes cuenta? <a href="registro.html">Crear cuenta gratis</a>
      &nbsp;·&nbsp;
      <a href="index.html">← Volver al inicio</a>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  // Redirigir si ya hay sesión
  AUTH.init(session => {
    if (session) {
      window.location.href = session.rol === 'admin' ? 'admin.html' : 'dashboard.html';
    }
  });

  function togglePass() {
    const p = document.getElementById('password');
    const eye = document.getElementById('pass-eye');
    p.type = p.type === 'password' ? 'text' : 'password';
    eye.textContent = p.type === 'password' ? '👁️' : '🙈';
  }

  function quickLogin(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
    document.getElementById('form-login').dispatchEvent(new Event('submit', { cancelable: true }));
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-login');
    const errEl = document.getElementById('msg-error');
    const sucEl = document.getElementById('msg-success');

    btn.textContent = 'Ingresando...';
    btn.disabled = true;
    errEl.style.display = 'none';
    sucEl.style.display = 'none';

    const result = await AUTH.login(email, password);
    if (result.ok) {
      sucEl.textContent = `✅ Bienvenido/a, ${result.user.nombre}! Redirigiendo...`;
      sucEl.style.display = 'block';
      setTimeout(() => {
        window.location.href = result.user.rol === 'admin' ? 'admin.html' : 'dashboard.html';
      }, 700);
    } else {
      errEl.textContent = '❌ ' + result.error;
      errEl.style.display = 'block';
      btn.textContent = 'Iniciar Sesión';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
